<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1b24" />
  <title>Last Waltz Set List Results</title>
  <meta name="description" content="Compare the band's suggested running orders for the Last Waltz show." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://jasensamford.com/lastwaltz/results/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;display=swap" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/lastwaltz/lastwaltz.css" />
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="lw-bar">
    <div class="wrap wrap-narrow lw-bar-inner">
      <span class="lw-bar-name">The Last Waltz</span>
      <nav class="lw-tabs" aria-label="Set list pages">
        <a href="/lastwaltz/">My order</a>
        <a href="/lastwaltz/results/" aria-current="page">Results</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <header class="page-header">
      <div class="wrap wrap-narrow">
        <h1>Set list results</h1>
        <p class="page-header-sub">
          Everyone's suggested orders, combined. Songs where we're all within a couple of slots are
          marked agreed; songs that are all over the place are the ones to talk through.
          <a href="/lastwaltz/">Add or change your order</a>.
        </p>
      </div>
    </header>

    <div class="page-body">
      <div class="wrap wrap-narrow">
        <form class="contact-form card setlist-gate">
          <div class="form-field">
            <label for="setlist-password">Band password</label>
            <input id="setlist-password" type="password" name="password" autocomplete="current-password" required />
          </div>
          <p class="form-status" role="status" aria-live="polite"></p>
          <button type="submit" class="btn btn-primary">Open results</button>
        </form>

        <div class="lw-results" hidden>
          <p class="form-status" role="status" aria-live="polite">Loading...</p>
          <div class="lw-output"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/setlist-data.js"></script>
  <script src="/js/lastwaltz.js"></script>
  <script src="/js/setlist-results.js"></script>
</body>
</html>
